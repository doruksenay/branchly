name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: branchly

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: branchly/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: branchly/src-tauri -> target

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle ve paketle
        run: npx tauri build

      - name: Kurulum dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Branchly-Windows
          path: |
            branchly/src-tauri/target/release/bundle/msi/*.msi
            branchly/src-tauri/target/release/bundle/nsis/*.exe
