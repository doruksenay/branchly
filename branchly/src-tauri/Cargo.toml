[package]
name = "branchly"
version = "0.1.0"
description = "Branchly - hafif, modern Git istemcisi"
authors = ["Branchly"]
edition = "2021"

[lib]
name = "branchly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "6"
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
url = "2"
rand = "0.8"
tempfile = "3"
roxmltree = "0.20"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
